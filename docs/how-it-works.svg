<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="850" rx="24" fill="#f8fafc"/>

  <!-- 1. you ask -->
  <g filter="url(#soft)">
    <rect x="300" y="28" width="400" height="64" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="500" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">You: "Claude, make promo video X"</text>
  </g>
  <line x1="500" y1="92" x2="500" y2="128" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. claude edits -->
  <g filter="url(#soft)">
    <rect x="270" y="132" width="460" height="64" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="500" y="171" text-anchor="middle" font-size="18" font-weight="600" fill="#334155">Claude edits the Remotion code</text>
  </g>
  <line x1="500" y1="196" x2="500" y2="232" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. the gate -->
  <g filter="url(#soft)">
    <rect x="150" y="236" width="700" height="300" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="500" y="276" text-anchor="middle" font-size="20" font-weight="800" fill="#6d28d9" font-family="ui-monospace, Menlo, monospace">framevet check X --json</text>
    <line x1="190" y1="294" x2="810" y2="294" stroke="#ede9fe" stroke-width="1.5"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5b21b6">
      <rect x="190" y="306" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="323">1. validate framevet.config.json</text>
      <rect x="190" y="338" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="355">2. npx remotion browser ensure (preflight)</text>
      <rect x="190" y="370" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="387">3. npx remotion still … --frame=N (one at a time)</text>
      <rect x="190" y="402" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="419">4. build index.html gallery of the frames</text>
      <rect x="190" y="434" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="451">5. serve it on a random localhost port</text>
      <rect x="190" y="466" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="483">6. kane-cli run --objective "…OBSERVATION &lt;N&gt;: PASS|FAIL…"</text>
      <rect x="190" y="498" width="620" height="26" rx="13" fill="#f5f3ff"/><text x="210" y="515">7. parse Kane's NDJSON → verdict</text>
    </g>
  </g>

  <!-- split -->
  <path d="M 500 536 C 500 566, 280 560, 280 592" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 500 536 C 500 566, 720 560, 720 592" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- FAIL -->
  <g filter="url(#soft)">
    <rect x="80" y="596" width="400" height="150" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="280" y="634" text-anchor="middle" font-size="18" font-weight="800" fill="#b91c1c">✗ FAIL (exit 11 / 12 / 13 / 16)</text>
    <g font-size="14" fill="#7f1d1d" text-anchor="middle">
      <text x="280" y="662">no render started</text>
      <text x="280" y="686">reason + observations per frame</text>
      <text x="280" y="710" font-family="ui-monospace, Menlo, monospace" font-size="12.5">.framevet/&lt;runId&gt;/ evidence (PNGs, kane.ndjson)</text>
    </g>
  </g>

  <!-- PASS -->
  <g filter="url(#soft)">
    <rect x="520" y="596" width="400" height="110" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="720" y="634" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d">✓ PASS (exit 0)</text>
    <text x="720" y="664" text-anchor="middle" font-size="14" fill="#166534">OBSERVATION … PASS for every configured frame</text>
  </g>
  <line x1="720" y1="706" x2="720" y2="742" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- render once -->
  <g filter="url(#soft)">
    <rect x="480" y="746" width="480" height="72" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="720" y="780" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46" font-family="ui-monospace, Menlo, monospace">framevet render X</text>
    <text x="720" y="804" text-anchor="middle" font-size="14" fill="#047857">render runs once → out/X.mp4</text>
  </g>
</svg>
