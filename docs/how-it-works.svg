<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="gateBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="980" fill="#0b1020" rx="18"/>

  <!-- user prompt -->
  <g filter="url(#shadow)">
    <rect x="250" y="24" width="460" height="58" rx="14" fill="#2563eb"/>
    <text x="480" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">You: "Claude, make promo video X"</text>
  </g>
  <line x1="480" y1="82" x2="480" y2="118" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- claude edits -->
  <g filter="url(#shadow)">
    <rect x="220" y="124" width="520" height="58" rx="14" fill="#475569"/>
    <text x="480" y="159" text-anchor="middle" font-size="19" font-weight="600" fill="#e2e8f0">Claude edits the Remotion code (as usual)</text>
  </g>
  <line x1="480" y1="182" x2="480" y2="218" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- gate box -->
  <g filter="url(#shadow)">
    <rect x="120" y="224" width="720" height="392" rx="18" fill="url(#gateBg)" stroke="#64748b" stroke-width="1.5"/>
    <text x="480" y="268" text-anchor="middle" font-size="21" font-weight="800" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace">framevet check X --json</text>
    <line x1="160" y1="286" x2="800" y2="286" stroke="#334155" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="16.5" fill="#cbd5e1">
      <text x="165" y="322">1. validate framevet.config.json</text>
      <text x="165" y="362">2. npx remotion browser ensure     (preflight, no timer)</text>
      <text x="165" y="402">3. npx remotion still … --frame=N  (one frame at a time)</text>
      <text x="165" y="442">4. build index.html gallery of the frames</text>
      <text x="165" y="482">5. serve it on a random localhost port</text>
      <text x="165" y="522">6. kane-cli run --objective "…OBSERVATION &lt;N&gt;: PASS|FAIL…"</text>
      <text x="165" y="562">7. parse Kane's NDJSON → verdict</text>
    </g>
  </g>

  <!-- split arrows -->
  <path d="M 480 616 C 480 660, 250 650, 250 706" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 480 616 C 480 660, 710 650, 710 706" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- FAIL -->
  <g filter="url(#shadow)">
    <rect x="60" y="712" width="380" height="168" rx="14" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="250" y="752" text-anchor="middle" font-size="20" font-weight="800" fill="#fca5a5">FAIL (exit 11 / 12 / 13 / 16)</text>
    <g font-size="15.5" fill="#fecaca" text-anchor="middle">
      <text x="250" y="786">no render started</text>
      <text x="250" y="812">reason + per-frame observations</text>
      <text x="250" y="838" font-family="ui-monospace, Menlo, monospace">.framevet/&lt;runId&gt;/ evidence (PNGs, kane.ndjson)</text>
    </g>
  </g>

  <!-- PASS -->
  <g filter="url(#shadow)">
    <rect x="520" y="712" width="380" height="118" rx="14" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="710" y="756" text-anchor="middle" font-size="20" font-weight="800" fill="#86efac">PASS (exit 0)</text>
    <text x="710" y="790" text-anchor="middle" font-size="15.5" fill="#bbf7d0">every frame has an OBSERVATION … PASS line</text>
  </g>
  <line x1="710" y1="830" x2="710" y2="866" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- render -->
  <g filter="url(#shadow)">
    <rect x="470" y="872" width="480" height="76" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="710" y="905" text-anchor="middle" font-size="18" font-weight="700" fill="#dcfce7" font-family="ui-monospace, Menlo, monospace">framevet render X</text>
    <text x="710" y="930" text-anchor="middle" font-size="14.5" fill="#bbf7d0">render runs ONCE → out/X.mp4</text>
  </g>
</svg>
